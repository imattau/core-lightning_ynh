#:schema https://github.com/YunoHost/apps/raw/main/schemas/config_panel.v1.schema.json

version = "1.0"

[node]
name.en = "Core Lightning"
name.fr = "Core Lightning"
services = ["__APP__"]

    [node.settings]
    name.en = "Node settings"
    name.fr = "Paramètres du nœud"
    services = ["__APP__"]

        [node.settings.alias]
        ask.en = "Node alias"
        ask.fr = "Alias du nœud"
        type = "string"
        bind = "alias:__APP__"

        [node.settings.p2p]
        ask.en = "Lightning P2P port"
        ask.fr = "Port P2P Lightning"
        type = "number"
        min = 1
        max = 65535
        default = 9735
        bind = "p2p:__APP__"

        [node.settings.log_level]
        ask.en = "Log level"
        ask.fr = "Niveau de journalisation"
        type = "select"
        choices = ["info", "debug", "io"]
        default = "info"
        bind = "log_level:__APP__"

        [node.settings.announce_addr]
        ask.en = "Public announce address (optional)"
        ask.fr = "Adresse publique annoncée (optionnel)"
        type = "string"
        optional = true
        bind = "announce_addr:__APP__"
        help.en = "Host:port or Tor address announced to peers. Leave empty to use Core Lightning's automatic address discovery."

        [node.settings.rgb]
        ask.en = "Node color (optional)"
        ask.fr = "Couleur du nœud (optionnel)"
        type = "string"
        optional = true
        bind = "rgb:__APP__"
        help.en = "Exactly six hexadecimal characters, for example FFA500."

        [node.settings.fee_base]
        ask.en = "Routing base fee (millisatoshis)"
        ask.fr = "Frais de base de routage (millisatoshis)"
        type = "number"
        min = 0
        default = 1000
        bind = "fee_base:__APP__"

        [node.settings.fee_per_sat]
        ask.en = "Routing proportional fee (millionths)"
        ask.fr = "Frais proportionnels de routage (millionièmes)"
        type = "number"
        min = 0
        default = 10
        bind = "fee_per_sat:__APP__"

        [node.settings.min_capacity_sat]
        ask.en = "Minimum channel capacity (satoshis)"
        ask.fr = "Capacité minimale de canal (satoshis)"
        type = "number"
        min = 0
        default = 10000
        bind = "min_capacity_sat:__APP__"
        help.en = "Reject incoming channels whose effective capacity is below this value."

        [node.settings.grpc_enabled]
        ask.en = "Enable gRPC (for local apps like Alby Hub)"
        ask.fr = "Activer gRPC (pour les applications locales comme Alby Hub)"
        type = "boolean"
        default = false
        bind = "grpc_enabled:__APP__"
        help.en = "Exposes a localhost-only, certificate-authenticated gRPC endpoint that other apps on this server can use as a Lightning backend. Never opened to the internet."

        [node.settings.grpc_port]
        ask.en = "gRPC port"
        ask.fr = "Port gRPC"
        type = "number"
        min = 1
        max = 65535
        default = 9736
        bind = "grpc_port:__APP__"
        visible = "grpc_enabled"

        [node.settings.status]
        ask.en = "Operational status"
        ask.fr = "État opérationnel"
        type = "alert"
        style = "info"

    [node.recovery]
    name.en = "Recovery"
    name.fr = "Récupération"
    services = ["__APP__"]

        [node.recovery.show_recovery_mnemonic]
        ask.en = "Show recovery mnemonic"
        ask.fr = "Afficher la phrase de récupération"
        type = "button"
        style = "warning"
        icon = "key"
        bind = "null"

    [node.channels]
    name.en = "Peers & channels"
    name.fr = "Pairs & canaux"

        [node.channels.peer_mode]
        ask.en = "Peer selection"
        ask.fr = "Sélection du pair"
        type = "select"
        choices = ["discovered", "manual"]
        default = "discovered"
        bind = "null"

        [node.channels.peer_discovery_status]
        ask.en = "Peer discovery status"
        ask.fr = "État de la découverte des pairs"
        type = "alert"
        style = "info"
        bind = "null"

        [node.channels.peer_id]
        ask.en = "Discovered peer"
        ask.fr = "Pair découvert"
        type = "select"
        choices = []
        optional = true
        bind = "null"
        visible = "peer_mode == 'discovered'"

        [node.channels.manual_peer_id]
        ask.en = "Manual peer node ID"
        ask.fr = "Identifiant du pair"
        type = "string"
        optional = true
        bind = "null"
        pattern.regexp = '^[0-9A-Fa-f]{66}$'
        pattern.error.en = "Enter a 66-character hexadecimal node ID."
        visible = "peer_mode == 'manual'"

        [node.channels.manual_peer_host]
        ask.en = "Manual peer host or IP address"
        ask.fr = "Hôte ou adresse IP manuel du pair"
        type = "string"
        optional = true
        bind = "null"
        help.en = "Only needed when the peer is not reachable through gossip or DNS."
        visible = "peer_mode == 'manual'"

        [node.channels.manual_peer_port]
        ask.en = "Manual peer P2P port"
        ask.fr = "Port P2P manuel du pair"
        type = "number"
        min = 1
        max = 65535
        default = 9735
        bind = "null"
        visible = "peer_mode == 'manual'"

        [node.channels.channel_amount_sat]
        ask.en = "Channel amount (satoshis)"
        ask.fr = "Montant du canal (satoshis)"
        type = "number"
        min = 546
        max = 16777215
        optional = true
        bind = "null"
        help.en = "Taken from the Core Lightning on-chain wallet, plus the transaction fee."

        [node.channels.public_channel]
        ask.en = "Public channel"
        ask.fr = "Canal public"
        type = "boolean"
        default = false
        bind = "null"
        help.en = "Leave disabled for a private channel. Enable only if you intentionally want to announce this channel for routing."

        [node.channels.confirm_channel_open]
        ask.en = "I understand this will spend CLN wallet funds"
        ask.fr = "Je comprends que cela dépensera les fonds du portefeuille CLN"
        type = "boolean"
        default = false
        bind = "null"

        [node.channels.connect_peer]
        ask.en = "Connect to peer"
        ask.fr = "Se connecter au pair"
        type = "button"
        style = "info"
        icon = "plug"
        bind = "null"
        enabled = "(peer_mode == 'discovered' && peer_id) || (peer_mode == 'manual' && manual_peer_id && manual_peer_host && manual_peer_port)"

        [node.channels.open_channel]
        ask.en = "Open channel"
        ask.fr = "Ouvrir un canal"
        type = "button"
        style = "warning"
        icon = "exchange"
        bind = "null"
        enabled = "(((peer_mode == 'discovered' && peer_id) || (peer_mode == 'manual' && manual_peer_id)) && channel_amount_sat && confirm_channel_open)"

        [node.channels.show_channels]
        ask.en = "Show channels"
        ask.fr = "Afficher les canaux"
        type = "button"
        style = "success"
        icon = "list"
        bind = "null"

    [node.funding]
    name.en = "On-chain funding"
    name.fr = "Financement on-chain"

        [node.funding.generate_deposit_address]
        ask.en = "Generate deposit address"
        ask.fr = "Générer une adresse de dépôt"
        type = "button"
        style = "info"
        icon = "bitcoin"
        bind = "null"

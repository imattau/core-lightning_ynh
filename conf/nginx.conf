# Reverse proxy for the Core Lightning web interface.
# YunoHost substitutes __DOMAIN__, __PATH__, and __PORT__ when installing.
location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    # xpay (used by the Payments page to send Lightning payments) can
    # legitimately take up to ~90s while it retries failed routes, so the
    # proxy timeout must exceed the API server's own 90s RPC timeout.
    proxy_read_timeout 100s;
    proxy_send_timeout 100s;
}
